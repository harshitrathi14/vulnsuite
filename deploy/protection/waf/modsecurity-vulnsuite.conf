# Requires installed ModSecurity v3 + JSON (YAJL) support and OWASP CRS.
# Adjust these paths to the distribution. Base config must include unicode.mapping.
Include /etc/modsecurity/modsecurity.conf

# Start with observation; after tuning change this single directive to On.
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Serial JSON emits one object per line. H includes rule messages.
# Omit request/response bodies and headers from audit parts.
# ModSecurity still may include URI and matched data: secure the local audit log.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLogParts AHZ
SecAuditLog /var/log/modsecurity/vulnsuite-audit.json

# Install and tune CRS before enabling blocking. Paths may vary by distribution.
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/modsecurity/crs/rules/*.conf

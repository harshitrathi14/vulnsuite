# VulnSuite - Full stack deployment
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Services:
#   postgres    - Findings/assets store with RLS enabled
#   redis       - Celery broker + EPSS L2 cache
#   api         - FastAPI app (port 8000)
#   worker      - Celery worker (all queues)
#   beat        - Celery beat scheduler (nightly Azure discovery)
#   dashboard   - Legacy Streamlit dashboard (opt-in profile, localhost only)
#
# Configure deploy/auth.env.example before starting; no credentials default.
# For BFSI production: mount
# Azure credentials from Key Vault via an init container, and add
# TLS termination at the ingress (nginx/Traefik/Azure App Gateway).

x-common-env: &common-env
  VULNSUITE_ENVIRONMENT: "production"
  VULNSUITE_LOG_LEVEL: "INFO"
  VULNSUITE_DB_URL: "postgresql+asyncpg://vulnsuite_app:${DB_PASSWORD:?Set a random URL-safe application database password}@postgres:5432/vulnsuite"
  VULNSUITE_REDIS_URL: "redis://:${REDIS_PASSWORD:?Set a random URL-safe Redis password}@redis:6379/0"
  VULNSUITE_AUTH_OIDC_ISSUER: "${OIDC_ISSUER:?Set the exact trusted HTTPS identity-provider issuer}"
  VULNSUITE_AUTH_OIDC_AUDIENCE: "${OIDC_AUDIENCE:-vulnsuite-api}"
  VULNSUITE_AUTH_JWKS_URL: "${OIDC_JWKS_URL:?Set the trusted HTTPS public JWKS URL}"
  VULNSUITE_AUTH_JWT_ALGORITHMS: '${OIDC_JWT_ALGORITHMS:-["RS256"]}'
  VULNSUITE_AUTH_TENANT_CLAIM: "${OIDC_TENANT_CLAIM:-tenant_id}"
  VULNSUITE_AUTH_ROLES_CLAIM: "${OIDC_ROLES_CLAIM:-roles}"
  VULNSUITE_AUTH_JWKS_CACHE_SECONDS: "${OIDC_JWKS_CACHE_SECONDS:-300}"
  VULNSUITE_AUTH_MAX_TOKEN_LIFETIME_SECONDS: "${OIDC_MAX_TOKEN_LIFETIME_SECONDS:-28800}"
  # Tenants the nightly beat discovery fans out to (JSON list of UUIDs).
  VULNSUITE_SCAN_SCHEDULED_DISCOVERY_TENANTS: '${SCHEDULED_DISCOVERY_TENANTS:-[]}'
  # Cloud creds — Azure first, AWS + GCP for Phase 2 parity
  AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
  AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
  AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
  AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID:-}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
  AWS_REGION: "${AWS_REGION:-ap-south-1}"
  GCP_PROJECT_ID: "${GCP_PROJECT_ID:-}"
  GOOGLE_APPLICATION_CREDENTIALS: "/var/lib/vulnsuite/secrets/gcp.json"
  # Kubernetes — kubeconfig is mounted read-only from the host/secret-store
  VULNSUITE_K8S_KUBECONFIG_PATH: "/var/lib/vulnsuite/secrets/kubeconfig"
  # API security: gates DAST. Empty allowlist + active=false means DAST is off
  # by default; ops must explicitly opt in per environment.
  VULNSUITE_APISEC_DAST_ALLOWLIST: "${DAST_ALLOWLIST:-[]}"
  VULNSUITE_APISEC_ALLOW_ACTIVE_SCAN: "${DAST_ALLOW_ACTIVE:-false}"
  VULNSUITE_APISEC_NUCLEI_SEVERITY_FLOOR: "${NUCLEI_SEVERITY_FLOOR:-medium}"
  # ASM passive defaults — nmap validation off until you've vetted targets
  VULNSUITE_ASM_ALLOW_NMAP_VALIDATION: "${ASM_ALLOW_NMAP:-false}"
  VULNSUITE_ASM_MAX_SUBDOMAINS_PER_ROOT: "${ASM_MAX_SUBDOMAINS:-500}"
  # Supply chain: keyless cosign verification policy. Both identity + issuer
  # must match the build pipeline's workload identity.
  VULNSUITE_SUPPLYCHAIN_COSIGN_CERTIFICATE_IDENTITY: "${COSIGN_IDENTITY:-}"
  VULNSUITE_SUPPLYCHAIN_COSIGN_CERTIFICATE_OIDC_ISSUER: "${COSIGN_OIDC_ISSUER:-}"
  VULNSUITE_SUPPLYCHAIN_REQUIRE_ATTESTATION_TYPE: "${COSIGN_REQUIRE_ATTESTATION:-}"
  TZ: "Asia/Kolkata"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnsuite
      # PostgreSQL's POSTGRES_USER is always a bootstrap superuser. Application
      # processes use the separate non-bypass role created by the init script.
      POSTGRES_USER: vulnsuite_bootstrap
      POSTGRES_PASSWORD: "${POSTGRES_BOOTSTRAP_PASSWORD:?Set a distinct random bootstrap database password}"
      VULNSUITE_APP_DB_PASSWORD: "${DB_PASSWORD:?Set a random URL-safe application database password}"
      VULNSUITE_MIGRATOR_DB_PASSWORD: "${DB_MIGRATOR_PASSWORD:?Set a random URL-safe schema-owner database password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-application-role.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnsuite_bootstrap -d vulnsuite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vulnsuite]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set a random URL-safe Redis password}"
    # $$ defers expansion to the container shell so the password is read
    # from the environment, not baked into the command line.
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [vulnsuite]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      # Schema-owner connection, used only by init_db at start-up. Only the
      # API gets it; workers run with the DML-only runtime role.
      VULNSUITE_DB_MIGRATION_URL: "postgresql+asyncpg://vulnsuite_migrator:${DB_MIGRATOR_PASSWORD:?Set a random URL-safe schema-owner database password}@postgres:5432/vulnsuite"
      # Browser origins allowed to call the API, JSON list; empty = same-origin only.
      VULNSUITE_API_CORS_ORIGINS: '${API_CORS_ORIGINS:-[]}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      uvicorn vulnsuite.api.main:app
      --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [vulnsuite]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A vulnsuite.workers.celery_app worker
      --loglevel=INFO
      --concurrency=4
      --queues=vulnsuite.default,vulnsuite.scan,vulnsuite.discovery,vulnsuite.report,vulnsuite.ai
    # Scanner binaries expected in the image (Trivy, gitleaks, semgrep,
    # bandit, nmap, testssl.sh, prowler, dockle, osv-scanner,
    # trufflehog, pip-audit). See deploy/Dockerfile.
    volumes:
      - reports:/var/lib/vulnsuite/reports
      - offline-db:/var/lib/vulnsuite/offline    # air-gapped DBs
      # Phase 2: cluster + cloud creds, mounted read-only. Populate these
      # paths from a secrets manager (Key Vault / AWS Secrets Manager / Vault)
      # via an init container in production — never bake them into images.
      - ${KUBECONFIG_HOST_PATH:-/dev/null}:/var/lib/vulnsuite/secrets/kubeconfig:ro
      - ${GCP_CREDS_HOST_PATH:-/dev/null}:/var/lib/vulnsuite/secrets/gcp.json:ro
    networks: [vulnsuite]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8g"

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *common-env
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A vulnsuite.workers.celery_app beat
      --loglevel=INFO
    networks: [vulnsuite]

  dashboard:
    # Legacy UI accepts a manually entered tenant and has no identity binding.
    # The authenticated protection /console is the supported operations UI.
    profiles: ["legacy-dashboard"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    command: >
      streamlit run vulnsuite/dashboard/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    networks: [vulnsuite]

volumes:
  pgdata:
  redisdata:
  reports:
  offline-db:

networks:
  vulnsuite:
    driver: bridge

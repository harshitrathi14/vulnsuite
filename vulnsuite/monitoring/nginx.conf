location = /infosec { return 302 /VulnSuite/; }
location = /infosec/ { return 302 /VulnSuite/; }
location = /VulnSuite { return 302 /VulnSuite/; }
location ^~ /VulnSuite/ {
    proxy_pass http://127.0.0.1:8136;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
}
location = /VulnSuite/findings { return 302 /VulnSuite/findings/; }
location ^~ /VulnSuite/findings/ {
    proxy_pass http://127.0.0.1:8138;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_buffering off;
}
location = /VulnSuite/operations { return 302 /VulnSuite/operations/console; }
location = /VulnSuite/operations/ { return 302 /VulnSuite/operations/console; }
location ^~ /VulnSuite/operations/ {
    proxy_pass http://127.0.0.1:8139/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 256k;
}
